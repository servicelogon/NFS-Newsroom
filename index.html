<!-- Newsroom body, rendered inside the same shell as field notes and tools. -->
<section class="masthead" aria-label="Newsroom">
  <h1 class="page-title">Newsroom</h1>
</section>
<div class="workspace">
  <div class="browse-controls">
    <div id="coverage-pulse" class="coverage-pulse" hidden>
      <div class="coverage-pulse-band">
        <div class="coverage-pulse-copy">
          <p id="coverage-pulse-lead" class="coverage-pulse-lead" hidden></p>
          <div id="coverage-pulse-strip" class="coverage-pulse-strip"></div>
        </div>
        <canvas class="newsroom-globe" width="200" height="200" aria-hidden="true"></canvas>
      </div>
      <p class="coverage-pulse-note">Article volume, not threat severity. Microsoft coverage overlaps other topics.</p>
    </div>
    <nav class="coverage-switch" aria-label="Browse coverage">
      <button class="text-choice" id="front-page-link" type="button" aria-pressed="true">Front page</button>
      <button class="text-choice" id="pulse-all-coverage" type="button" aria-pressed="false">All coverage</button>
    </nav>
    <div class="newsroom-toolbar">
      <div class="briefing-bar" id="briefing-bar" hidden>
        <h1 id="section-title">Latest coverage</h1>
        <p class="description" id="description">The bigger picture, without the noise.</p>
        <div class="microsoft-filter" id="microsoft-filter" aria-label="Microsoft feed filters" hidden>
          <button type="button" data-microsoft-filter="all" aria-pressed="true">All Microsoft</button><button type="button" data-microsoft-filter="news" aria-pressed="false">Microsoft News</button><button type="button" data-microsoft-filter="message-center" aria-pressed="false">Message Center</button>
        </div>
        <p id="briefing-status" class="briefing-status" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
  <p class="news-error" id="news-error" role="status" hidden></p>
  <div class="content">
    <section class="front-page" id="front-page" aria-labelledby="front-page-title">
      <h1 id="front-page-title" class="visually-hidden">Front Page</h1>
      <time class="front-page-date" id="front-page-date"></time>
      <p class="visually-hidden" id="front-page-status" role="status" aria-live="polite"></p>
      <div class="front-page-feed" id="front-page-feed"></div>
      <div class="empty" id="front-page-empty" hidden>
        <span class="eyebrow" data-empty-eyebrow></span><h2 data-empty-title></h2><p data-empty-copy></p>
        <div class="empty-actions"><button class="internal-button" type="button" data-empty-reset>Show all coverage</button></div>
      </div>
    </section>
    <section id="briefing-view" aria-labelledby="section-title" hidden>
      <div class="feed" id="feed"></div>
      <button class="internal-button" id="load-more" type="button" hidden>Load more articles</button>
      <div class="empty" id="empty" hidden>
        <span class="eyebrow" data-empty-eyebrow></span><h2 data-empty-title></h2><p data-empty-copy></p>
        <div class="empty-actions"><button class="internal-button" id="reset" type="button" data-empty-reset>Show all coverage</button></div>
      </div>
    </section>
    <p class="feed-note">Headlines and excerpts from publisher feeds. Follow original links for full reporting.</p>
  </div>
</div>
<noscript><p class="empty">Enable JavaScript to browse live news. Field notes and the toolbox work without it.</p></noscript>
<aside class="newsroom-explore"><a href="/">Read the field notes</a><a href="/tools">Toolbox</a></aside>
